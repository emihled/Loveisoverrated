<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff4d8d" />
    <title>I know I can be stupid at times?</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="screen active" id="questionScreen">
      <div class="card">
        <span class="sparkle sparkle-2">💖</span>

        <p class="tag">A very serious question</p>
        <h1>Will you hang out with me?</h1>

        <div class="button-zone" aria-label="Answer buttons">
          <button id="yesBtn" class="btn btn-yes" type="button">Yes 😍</button>
          <button id="noBtn" class="btn btn-no" type="button" aria-label="No button">No 😬</button>
        </div>
      </div>
    </main>

    <main class="screen" id="successScreen">
      <div class="card success-card">
        <div class="success-badge">😮</div>
        <h2 class="graphic-title">Ohw</h2>
        <p class="graphic-copy">Reaally!!?</p>

        <div class="success-actions" aria-label="Final choices">
          <button id="startAgainBtn" class="btn btn-yes" type="button">Yeah sure why not</button>
          <button id="noFoolBtn" class="btn btn-dodge" type="button" aria-label="No fool button">No fool</button>
        </div>
      </div>
    </main>

    <main class="screen" id="finalScreen">
      <div class="card final-card">
        <p class="tag">Enkosi😊</p>
        <h2 class="graphic-title">Nice, Enkosi sisi</h2>
        <p class="graphic-copy">
          Pssh, I thought you was gonna say no, but hey... I’m glad you didn’t.
          But anyway, please send me a Hi or Hey, but I would really appreciate it if you just sent uMolo.
        </p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
